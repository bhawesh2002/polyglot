name: polyglot
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0
  flutter: ">=3.0.0"

dependencies:
  appwrite: ^20.2.1
  ffmpeg_kit_flutter_new: ^3.2.0
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.2
  freezed_annotation: ^3.1.0
  go_router: ^16.2.4
  hive_ce: ^2.14.0
  hive_ce_flutter: ^2.3.2
  json_annotation: ^4.9.0
  logging: ^1.3.0
  onnxruntime: ^1.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  riverpod_annotation: ^3.0.2
  shared_preferences: ^2.5.3
  tflite_flutter: ^0.11.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod: ^3.0.2
  build_runner: ^2.4.0
  freezed: ^3.2.3
  custom_lint: ^0.8.0
  freezed_lint: ^0.0.12
  riverpod_generator: ^3.0.2
  hive_ce_generator: ^1.9.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Typold #Designer:Jonathan Hill ; Link: https://font.download/font/typold
      fonts:
        - asset: assets/fonts/Typold ExtraThin.otf
          weight: 200
        - asset: assets/fonts/Typold Thin.otf
          weight: 200
        - asset: assets/fonts/Typold Light.otf
          weight: 300
        - asset: assets/fonts/Typold Regular.otf
          weight: 400
        - asset: assets/fonts/Typold Book.otf
          weight: 500
        - asset: assets/fonts/Typold Medium.otf
          weight: 600
        - asset: assets/fonts/Typold Bold.otf
          weight: 700
        - asset: assets/fonts/Typold ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Typold Black.otf
          weight: 900
